plugin = DvmPlugin
sources = main.c
copy = $sources
options = $options -o main$exe_extension
sample = compile.$platform.txt
clean = $copy $sample main$exe_extension
setvars_uni = $setvars
run = "${setvars_$platform} $dvm c $sources $options 2>&1 | $perl -p $sys_dir/filters/output_dvm.pl >compile.$platform.txt"
[skip]
not_set = ::dvm
